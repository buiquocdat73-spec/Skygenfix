name: Build SkyGenCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: tar -xzf SkyGenCore-Update-fixed.tar.gz

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B clean package
        working-directory: SkyGenCore-Update

      - uses: actions/upload-artifact@v4
        with:
          name: SkyGenCore-jar
          path: SkyGenCore-Update/target/*.jar
